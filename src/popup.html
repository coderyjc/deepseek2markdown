<!DOCTYPE html>
<html lang="zh">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<head>
    <title>DeepSeek Copilot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <img src="./icons/icon32.png" alt="logo" class="app-logo">
        <h1 class="app-title">DeepSeek <span class="brand-accent">Copilot</span></h1>
    </header>

    <button class="action-btn kb-btn" id="openKB">
        <span class="ico">📚</span><span class="lbl" data-i18n="openKB">知识库</span>
    </button>

    <button id="exportAsMarkdown" class="action-btn">
        <span class="ico">📄</span><span class="lbl" data-i18n="exportAsMarkdown">导出为 Markdown</span>
    </button>

    <button id="exportBatch" class="action-btn">
        <span class="ico">📦</span><span class="lbl" data-i18n="exportBatch">选择性导出</span>
    </button>

    <div class="action-row">
        <button id="exportAsPDF" class="action-btn action-half">
            <span class="ico">📕</span><span class="lbl" data-i18n="exportAsPDF">导出为 PDF</span>
        </button>
        <button id="exportAsImage" class="action-btn action-half">
            <span class="ico">🖼️</span><span class="lbl" data-i18n="exportAsImage">导出为图像</span>
        </button>
    </div>

    <button id="openSettings" class="action-btn">
        <span class="ico">⚙️</span><span class="lbl" data-i18n="openSettings">设置</span>
    </button>

    <div id="kbToast" class="kb-toast" hidden></div>

    <footer class="footer">
        <button id="languageToggle">中文|EN</button>
        <a href="https://github.com/coderyjc/deepseek2markdown" target="_blank">Github</a>
        <span>v0.4.0</span>
    </footer>

    <script src="db/schema.js"></script>
    <script src="db/repo.js"></script>
    <script src="security/crypto.js"></script>
    <script src="ai/settings.js"></script>
    <script src="popup.js"></script>
</body>

</html>
